<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF Hub — Results</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell" id="app-shell">
  <main class="main" id="page-content">
    <div class="page-head">
      <div>
        <div class="eyebrow">Results</div>
        <h1>Match results</h1>
        <p>Final placements, kills and prize breakdown for completed matches.</p>
      </div>
    </div>

    <div id="resultsList">
      <div class="loading-row">Loading results…</div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="ssModal">
  <div class="modal" style="max-width:640px;">
    <div class="modal-head">
      <h3 class="mb-0">Result proof</h3>
      <button class="close-x" id="closeSs">&times;</button>
    </div>
    <div class="modal-body">
      <img id="ssImg" src="" alt="Match result screenshot" style="width:100%;border-radius:3px;border:1px solid var(--line);">
    </div>
  </div>
</div>

<script type="module">
  import { renderShell } from "./nav.js";
  import { fetchAll, fmtDate, fmtMoney, escapeHtml } from "./db.js";

  renderShell("results");

  async function load() {
    let results = [];
    try {
      results = await fetchAll("results", "createdAt", "desc");
    } catch (e) {
      console.error(e);
      document.getElementById("resultsList").innerHTML = `<div class="empty"><p>Couldn't load results.</p></div>`;
      return;
    }

    const wrap = document.getElementById("resultsList");
    if (!results.length) {
      wrap.innerHTML = `<div class="panel"><div class="empty"><div class="empty-icon">▥</div><p>No results uploaded yet. The admin can add one from the admin panel.</p></div></div>`;
      return;
    }

    wrap.innerHTML = results.map(r => {
      const placements = (r.placements || []).slice().sort((a, b) => (a.position || 99) - (b.position || 99));
      const rows = placements.map(p => `
        <tr>
          <td class="num">#${escapeHtml(p.position ?? "—")}</td>
          <td>${escapeHtml(p.teamName || "—")}</td>
          <td class="num">${escapeHtml(p.kills ?? 0)}</td>
          <td class="num">${fmtMoney(p.prize)}</td>
        </tr>
      `).join("");

      return `
        <div class="panel section">
          <div class="panel-head">
            <div>
              <h2 class="mb-0">${escapeHtml(r.matchTitle || "Match result")}</h2>
              <div class="small text-faint">${fmtDate(r.date)}</div>
            </div>
            <div style="text-align:right;">
              <div class="small text-faint">Total pool</div>
              <div class="mono" style="font-size:18px;color:var(--accent);font-weight:600;">${fmtMoney(r.totalPrize)}</div>
            </div>
          </div>
          <div class="panel-body">
            ${placements.length ? `
              <div class="table-wrap">
                <table>
                  <thead><tr><th class="num">Pos</th><th>Team</th><th class="num">Kills</th><th class="num">Prize</th></tr></thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            ` : `<div class="empty small"><p>No placement breakdown added for this match.</p></div>`}
            ${r.notes ? `<div class="panel-body pad small text-muted">${escapeHtml(r.notes)}</div>` : ""}
            ${r.screenshotUrl ? `
              <div class="panel-body pad">
                <a href="#" class="thumb-link view-ss" data-src="${escapeHtml(r.screenshotUrl)}">
                  <img src="${escapeHtml(r.screenshotUrl)}" alt="Result screenshot thumbnail">
                </a>
                <div class="small text-faint" style="margin-top:6px;">Tap the screenshot to view proof full-size</div>
              </div>
            ` : ""}
          </div>
        </div>
      `;
    }).join("");

    document.querySelectorAll(".view-ss").forEach(el => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        document.getElementById("ssImg").src = el.dataset.src;
        document.getElementById("ssModal").classList.add("show");
      });
    });
  }

  document.getElementById("closeSs").addEventListener("click", () => {
    document.getElementById("ssModal").classList.remove("show");
  });
  document.getElementById("ssModal").addEventListener("click", (e) => {
    if (e.target.id === "ssModal") e.currentTarget.classList.remove("show");
  });

  load();
</script>
</body>
</html>
